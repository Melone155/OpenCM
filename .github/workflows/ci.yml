name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  server-web:
    name: Server & Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run api:generate -w web
          git diff --exit-code web/src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build -w web
      - run: npm audit --audit-level=high

  server-postgres:
    name: Server tests against PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opencm
          POSTGRES_PASSWORD: opencm
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opencm" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://opencm:opencm@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  go:
    name: ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        module: [cli, agent]
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # go.sum is generated on the first run; commit it afterwards so builds are reproducible.
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...

  cross-compile:
    name: Cross-compile CLI & agent
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build all OS/arch combinations
        run: |
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          for mod in cli agent; do
            (cd $mod && go mod tidy)
          done
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = windows ] && ext=".exe"
              (cd cli && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/opencm/opencm/cli/internal/cmd.Version=$VERSION" \
                -o ../dist/opencm-$os-$arch$ext .)
              (cd agent && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.Version=$VERSION" \
                -o ../dist/opencm-agent-$os-$arch$ext .)
            done
          done
          echo "$VERSION" > dist/version.txt
          (cd dist && sha256sum opencm-* > SHA256SUMS)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: server-web
    permissions:
      contents: read
      packages: write
    env:
      # pushes to main and version tags are published to GitHub Container Registry; PRs only build
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      REGISTRY: ghcr.io/melone155
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          # main → latest + sha-<short>; tag v1.2.3 → 1.2.3 + latest
          sha="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then extra="${GITHUB_REF_NAME#v}"; else extra="$sha"; fi
          for img in server web; do
            echo "$img=$REGISTRY/opencm-$img:latest,$REGISTRY/opencm-$img:$extra" >> "$GITHUB_OUTPUT"
          done
          # version of the agent binaries bundled in the server image
          echo "version=$extra" >> "$GITHUB_OUTPUT"
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.server }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.web }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Validate compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
