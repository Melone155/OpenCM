openapi: 3.1.0
info:
  title: OpenCM API
  version: 0.8.0
  description: |
    REST API of OpenCM. Single source of truth for the web UI, the CLI and integrations.

    **Authentication:** `POST /auth/login` returns an opaque session token. Send it as
    `Authorization: Bearer <token>` (CLI/integrations). Browsers additionally receive it
    as the httpOnly cookie `opencm_session`.

    **Permissions** are `module:action` strings (see `GET /permissions`). Every operation
    lists its required permission in `x-permission`.

    **Errors** always have the shape `{ "error": { "code", "message", "details?" } }`.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: users
  - name: groups
  - name: roles
  - name: audit
  - name: devices
  - name: enrollment
    description: Agent enrolment (agent ↔ server traffic after enrolment is described in openapi-agent.yaml)
  - name: device-groups
  - name: custom-fields
  - name: scripts
    description: |
      Script library. Versions are immutable; only `approved` versions can be used in jobs.
      Parameters reach the script as environment variables `OPENCM_PARAM_<NAME>` (upper case).
  - name: jobs
  - name: runs
    description: Executions of jobs and script test runs. Viewing requires `jobs:read` or `scripts:execute`.
  - name: vulnerabilities
    description: |
      CVE detection: installed software is mapped to NVD CPEs (rules first, then heuristics) and
      version-matched against the NVD mirror; CISA KEV marks actively exploited CVEs, FIRST EPSS
      adds the exploitation probability. Findings are re-evaluated after every feed sync and
      for every new inventory.
  - name: software
    description: Package repository (installer files, package managers, detection rules) with approval.
  - name: deployments
    description: Ring-based distribution (e.g. Test, Pilot, All) of packages and OS updates with automatic promotion.
  - name: patches
    description: Pending OS updates (Windows Update, apt, dnf, softwareupdate) per device, scans and reports.
  - name: reports
    description: Dashboard key figures and trends, report builder with saved reports and CSV export.
  - name: webhooks
    description: Signed event notifications to other systems (outbox with retries).
  - name: licenses
    description: Software license management – licenses an organisation owns for third-party software (e.g. office suites) compared with the installations in the inventory. Not related to OpenCM's own license (MIT, unrestricted).
  - name: security-status
    description: |
      Security posture per device from the agent inventory: disk encryption (BitLocker, FileVault, LUKS),
      antivirus (Microsoft Defender, other products, XProtect), firewall, Secure Boot, TPM. A device is
      compliant when its disks are encrypted, the firewall is on and (Windows/macOS) an antivirus is active
      and up to date.
  - name: assets
    description: Assets without an agent (monitors, printers, phones, network gear, spare devices) with CSV import/export.
security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness/readiness incl. database check
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in (local account or LDAP/AD), with TOTP code if MFA is enabled
      description: |
        Rate-limited per client IP (`LOGIN_RATE_LIMIT_PER_MIN`). Local accounts are checked
        locally; unknown users and directory users against LDAP/AD (if configured).
        With MFA enabled and no `otp`, the response is 401 with error code `mfa_required`.
        `otp` accepts a 6-digit TOTP code or a recovery code; each code works only once.
        `mfaSetupRequired: true` means MFA is mandatory and must be set up before anything else.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                otp: { type: string, description: TOTP code or recovery code }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, user, mfaSetupRequired]
                properties:
                  token: { type: string, description: Opaque session token }
                  expiresAt: { type: string, format: date-time }
                  mfaSetupRequired: { type: boolean }
                  user: { $ref: '#/components/schemas/Me' }
        '503': { description: Directory service not reachable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and effective permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/mfa:
    get:
      tags: [auth]
      operationId: getMfaStatus
      responses:
        '200':
          description: Own MFA status
          content: { application/json: { schema: { type: object, required: [enabled, recoveryCodesLeft, required], properties: { enabled: { type: boolean }, recoveryCodesLeft: { type: integer }, required: { type: boolean } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/mfa/setup:
    post:
      tags: [auth]
      operationId: setupMfa
      summary: Generate a new TOTP secret (not active until confirmed via /auth/mfa/enable)
      responses:
        '200':
          description: Secret
          content: { application/json: { schema: { type: object, required: [secret, otpauthUri], properties: { secret: { type: string, description: base32 }, otpauthUri: { type: string } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/mfa/enable:
    post:
      tags: [auth]
      operationId: enableMfa
      summary: Confirm with a code; returns 10 one-time recovery codes (shown only here)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpCode' } } } }
      responses:
        '200': { description: Enabled, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/mfa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpCode' } } } }
      responses:
        '200': { description: New codes (old ones invalid), content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/mfa/disable:
    post:
      tags: [auth]
      operationId: disableMfa
      description: Not possible while MFA is mandatory (409).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpCode' } } } }
      responses:
        '204': { description: Disabled }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api-tokens:
    get:
      tags: [auth]
      operationId: listApiTokens
      x-permission: authenticated (all=true needs users:read)
      parameters: [{ name: all, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' }, description: tokens of all users }]
      responses:
        '200': { description: Tokens (never the secret), content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ApiToken' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      operationId: createApiToken
      x-permission: authenticated (interactive session only)
      description: |
        Personal token (`oct_…`), sent as `Authorization: Bearer`. Effective rights = token
        permissions ∩ owner's rights (empty list = owner's rights); the owner's device scope
        applies. Shown only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                permissions: { type: array, items: { type: string } }
                expiresInDays: { type: integer, minimum: 1, default: 90, description: 'max API_TOKEN_MAX_DAYS (365)' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiTokenBase' }, { type: object, required: [token], properties: { token: { type: string } } }] } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api-tokens/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [auth]
      operationId: revokeApiToken
      x-permission: own token or users:update
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /approvals:
    get:
      tags: [jobs]
      operationId: listApprovals
      x-permission: authenticated (jobs:approve sees all, others their own requests)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired, failed, all], default: pending } }
      responses:
        '200': { description: Requests, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Approval' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /approvals/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [jobs]
      operationId: approveRequest
      x-permission: 'jobs:approve | software:approve | patches:approve (je nach Anfrage)'
      description: Four-eyes – not by the requester. The action is executed on behalf of the requester (who must still be entitled); a changed job makes the request `failed`.
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: Decided (status approved or failed, see result), content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /approvals/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [jobs]
      operationId: rejectRequest
      x-permission: 'jobs:approve | software:approve | patches:approve (je nach Anfrage)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /settings/security:
    get:
      tags: [system]
      operationId: getSecuritySettings
      x-permission: settings:read
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [system]
      operationId: updateSecuritySettings
      x-permission: settings:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaRequired: { type: boolean }
                fourEyes: { type: object, properties: { enabled: { type: boolean }, deviceThreshold: { type: integer, minimum: 0 } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/ldap/test:
    post:
      tags: [system]
      operationId: testLdap
      x-permission: settings:update
      summary: Service-account bind and optional user lookup (no password involved)
      requestBody: { content: { application/json: { schema: { type: object, properties: { username: { type: string } } } } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  user:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [dn, username, displayName, groups]
                        properties:
                          dn: { type: string }
                          username: { type: string }
                          displayName: { type: string }
                          email: { type: [string, 'null'] }
                          groups: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/mfa/reset:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [users]
      operationId: resetUserMfa
      x-permission: users:update
      summary: Remove a user's MFA (lost device) and end the user's sessions
      responses:
        '204': { description: Reset }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /permissions:
    get:
      tags: [roles]
      operationId: listPermissions
      summary: Permission catalogue (modules and their actions)
      x-permission: authenticated
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                required: [actions, modules]
                properties:
                  actions: { type: array, items: { type: string } }
                  modules:
                    type: array
                    items:
                      type: object
                      required: [module, label, actions]
                      properties:
                        module: { type: string }
                        label: { type: string }
                        actions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      x-permission: users:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: search, in: query, schema: { type: string }, description: Substring of username or display name }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      x-permission: users:create
      description: Assigned roles may only contain permissions the caller holds itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [users]
      operationId: getUser
      x-permission: users:read
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      x-permission: users:update
      description: |
        `roleIds`/`groupIds` replace the current assignments. Deactivating a user or resetting
        another user's password ends all of that user's sessions. Users cannot deactivate
        themselves or change their own roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [users]
      operationId: deleteUser
      x-permission: users:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      x-permission: groups:read
      responses:
        '200':
          description: All groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [groups]
      operationId: createGroup
      x-permission: groups:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /groups/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [groups]
      operationId: getGroup
      x-permission: groups:read
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [groups]
      operationId: updateGroup
      x-permission: groups:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [groups]
      operationId: deleteGroup
      x-permission: groups:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      x-permission: roles:read
      responses:
        '200':
          description: All roles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [roles]
      operationId: createRole
      x-permission: roles:create
      description: A role may only contain permissions the caller holds itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [roles]
      operationId: getRole
      x-permission: roles:read
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [roles]
      operationId: updateRole
      x-permission: roles:update
      description: System roles (`isSystem`) cannot be modified (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [roles]
      operationId: deleteRole
      x-permission: roles:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /audit-log:
    get:
      tags: [audit]
      operationId: listAuditLog
      x-permission: audit:read
      summary: Append-only audit trail, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: action, in: query, schema: { type: string }, example: user.create }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Page of audit entries
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-log/export:
    get:
      tags: [audit]
      operationId: exportAuditLog
      x-permission: audit:read
      summary: Export (CSV with BOM and `;` separator, or JSON), oldest first, max. 100,000 entries
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: action, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: File download
          content:
            text/csv: { schema: { type: string } }
            application/json:
              schema:
                type: object
                required: [exportedAt, truncated, items]
                properties:
                  exportedAt: { type: string, format: date-time }
                  truncated: { type: boolean }
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      x-permission: devices:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: search, in: query, schema: { type: string }, description: Substring of hostname, serial number, logged-on user or model }
        - { name: os, in: query, schema: { $ref: '#/components/schemas/OS' } }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked] } }
        - { name: online, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: sort, in: query, schema: { type: string, enum: [hostname, lastSeenAt, enrolledAt], default: hostname } }
      responses:
        '200':
          description: Page of devices
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Device' } }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [devices]
      operationId: getDevice
      x-permission: devices:read
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      operationId: deleteDevice
      x-permission: devices:delete
      description: Deletes the device incl. inventory and history. Its certificate stops working immediately.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/inventory:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [devices]
      operationId: getDeviceInventory
      x-permission: inventory:read
      summary: Latest inventory snapshot (without software – see /software)
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/software:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [devices]
      operationId: listDeviceSoftware
      x-permission: inventory:read
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Substring of name or publisher }
      responses:
        '200':
          description: Installed software
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Software' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [devices]
      operationId: listDeviceHistory
      x-permission: inventory:read
      summary: Inventory change log, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema: { type: string, enum: [device, hardware, os, software, patch, service, autostart, user, group, disk] }
      responses:
        '200':
          description: Page of changes
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/inventory-request:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [devices]
      operationId: requestDeviceInventory
      x-permission: inventory:update
      summary: Ask the agent to send a fresh inventory with its next heartbeat
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema: { type: object, properties: { requested: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [devices]
      operationId: revokeDevice
      x-permission: devices:update
      summary: Revoke the device certificate (takes effect immediately). Re-enrol to restore.
      responses:
        '200':
          description: Revoked device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enrollment-tokens:
    get:
      tags: [enrollment]
      operationId: listEnrollmentTokens
      x-permission: devices:create
      responses:
        '200':
          description: Tokens (the secret itself is never returned again)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EnrollmentToken' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [enrollment]
      operationId: createEnrollmentToken
      x-permission: devices:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                expiresInHours: { type: integer, minimum: 1, maximum: 8760, default: 168 }
                maxUses: { type: [integer, 'null'], minimum: 1, description: null = unlimited }
                deviceGroupId: { type: [string, 'null'], format: uuid, description: Enrolled devices are added to this group }
      responses:
        '201':
          description: Created. `token` and `installCommands` are only returned here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnrollmentToken'
                  - type: object
                    required: [token, installCommands]
                    properties:
                      token: { type: string }
                      installCommands:
                        type: object
                        required: [windows, linux, macos]
                        properties:
                          windows: { type: string, description: PowerShell (as Administrator) }
                          linux: { type: string, description: sh (as root) }
                          macos: { type: string, description: sh (as root) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /enrollment-tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [enrollment]
      operationId: revokeEnrollmentToken
      x-permission: devices:create
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/enroll:
    post:
      tags: [enrollment]
      operationId: enrollAgent
      summary: Called by the agent – exchange an enrollment token + CSR for a client certificate
      description: |
        Public (the enrollment token is the credential), rate-limited. The certificate's
        subject is assigned by the server (CN = device id); the requested subject is ignored.
        Every `machineId` exists once: if a device with this `machineId` is already registered
        (active or revoked) the request is rejected with 409 `device_already_enrolled` and the
        token is not consumed. An administrator has to delete the device first; the machine then
        enrolls as a new device with a new id.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, csr, hostname, os, machineId]
              properties:
                token: { type: string }
                csr: { type: string, description: PEM PKCS#10 (ECDSA P-256/P-384 or RSA ≥ 2048) }
                hostname: { type: string }
                os: { $ref: '#/components/schemas/OS' }
                osVersion: { type: string }
                arch: { type: string }
                agentVersion: { type: string }
                machineId: { type: string, minLength: 8 }
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, certificate, caCertificate, certificateExpiresAt, agentUrl, heartbeatSeconds]
                properties:
                  deviceId: { type: string, format: uuid }
                  certificate: { type: string, description: PEM client certificate }
                  caCertificate: { type: string, description: PEM CA certificate (trust anchor for agentUrl) }
                  certificateExpiresAt: { type: string, format: date-time }
                  agentUrl: { type: string, description: Base URL of the mTLS agent endpoint }
                  heartbeatSeconds: { type: integer }
                  signingPublicKey: { type: string, description: 'Ed25519 public key (raw 32 bytes, base64) – the agent only executes tasks/updates signed with it' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent-downloads:
    get:
      tags: [enrollment]
      operationId: listAgentDownloads
      summary: Available agent binaries (public)
      security: []
      responses:
        '200':
          description: Binaries
          content:
            application/json:
              schema:
                type: object
                required: [version, items]
                properties:
                  version: { type: [string, 'null'] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [os, arch, sizeBytes, sha256, url]
                      properties:
                        os: { $ref: '#/components/schemas/OS' }
                        arch: { type: string, enum: [amd64, arm64] }
                        version: { type: [string, 'null'] }
                        sizeBytes: { type: integer }
                        sha256: { type: string }
                        url: { type: string }

  /agent-downloads/{os}/{arch}:
    parameters:
      - { name: os, in: path, required: true, schema: { $ref: '#/components/schemas/OS' } }
      - { name: arch, in: path, required: true, schema: { type: string, enum: [amd64, arm64] } }
    get:
      tags: [enrollment]
      operationId: downloadAgent
      summary: Download an agent binary (public). Header `x-checksum-sha256` carries the checksum.
      security: []
      responses:
        '200':
          description: Binary
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ M2: device groups
  /device-groups:
    get:
      tags: [device-groups]
      operationId: listDeviceGroups
      x-permission: device_groups:read
      responses:
        '200':
          description: Groups with current member count
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DeviceGroup' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [device-groups]
      operationId: createDeviceGroup
      x-permission: device_groups:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [static, dynamic] }
                name: { type: string, maxLength: 100 }
                description: { type: string }
                deviceIds: { type: array, items: { type: string, format: uuid }, description: static groups only }
                filter: { $ref: '#/components/schemas/GroupFilter' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceGroup' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /device-groups/preview:
    post:
      tags: [device-groups]
      operationId: previewDeviceGroup
      x-permission: device_groups:read
      summary: Evaluate a dynamic filter (first 50 matches + total)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [filter], properties: { filter: { $ref: '#/components/schemas/GroupFilter' } } } } }
      responses:
        '200': { description: Matches, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRefPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /device-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [device-groups]
      operationId: getDeviceGroup
      x-permission: device_groups:read
      responses:
        '200': { description: Group, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [device-groups]
      operationId: updateDeviceGroup
      x-permission: device_groups:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                filter: { $ref: '#/components/schemas/GroupFilter' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceGroup' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [device-groups]
      operationId: deleteDeviceGroup
      x-permission: device_groups:delete
      description: Fails with 409 while jobs target the group.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /device-groups/{id}/members:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [device-groups]
      operationId: setDeviceGroupMembers
      x-permission: device_groups:update
      summary: Replace the members of a static group
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [deviceIds], properties: { deviceIds: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceGroup' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /device-groups/{id}/devices:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [device-groups]
      operationId: listDeviceGroupDevices
      x-permission: device_groups:read
      summary: Current (resolved) members – active devices only
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { description: Members, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRefPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ M2: custom fields
  /custom-fields:
    get:
      tags: [custom-fields]
      operationId: listCustomFields
      x-permission: inventory:read
      responses:
        '200': { description: Fields, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CustomField' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [custom-fields]
      operationId: createCustomField
      x-permission: settings:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, label]
              properties:
                name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: 'used in filters as custom:<name>' }
                label: { type: string }
                type: { type: string, enum: [string, number, boolean, date], default: string }
                description: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomField' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /custom-fields/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [custom-fields]
      operationId: updateCustomField
      x-permission: settings:update
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { label: { type: string }, description: { type: string } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CustomField' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [custom-fields]
      operationId: deleteCustomField
      x-permission: settings:update
      responses:
        '204': { description: Deleted (incl. all values) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/custom-fields:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [custom-fields]
      operationId: listDeviceCustomFields
      x-permission: inventory:read
      responses:
        '200': { description: All fields with this device's values, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CustomFieldValue' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/custom-fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [custom-fields]
      operationId: setDeviceCustomField
      x-permission: inventory:update
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: [string, number, boolean] } } } } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldValue' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [custom-fields]
      operationId: clearDeviceCustomField
      x-permission: inventory:update
      responses:
        '204': { description: Cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ M2: scripts
  /interpreters:
    get:
      tags: [scripts]
      operationId: listInterpreters
      x-permission: authenticated
      responses:
        '200':
          description: Supported interpreters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, label, os, editorLanguage]
                      properties:
                        name: { $ref: '#/components/schemas/Interpreter' }
                        label: { type: string }
                        os: { type: array, items: { $ref: '#/components/schemas/OS' } }
                        editorLanguage: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scripts:
    get:
      tags: [scripts]
      operationId: listScripts
      x-permission: scripts:read
      parameters: [{ name: search, in: query, schema: { type: string } }]
      responses:
        '200': { description: Scripts, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Script' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [scripts]
      operationId: createScript
      x-permission: scripts:create
      summary: Create a script with version 1 (draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, interpreter, content]
              properties:
                name: { type: string, maxLength: 150 }
                description: { type: string }
                interpreter: { $ref: '#/components/schemas/Interpreter' }
                content: { type: string, description: max. 512 KiB }
                parameters: { type: array, items: { $ref: '#/components/schemas/ScriptParameter' } }
                changeNote: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ScriptDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [scripts]
      operationId: getScript
      x-permission: scripts:read
      responses:
        '200': { description: Script with version history (without content), content: { application/json: { schema: { $ref: '#/components/schemas/ScriptDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [scripts]
      operationId: updateScript
      x-permission: scripts:update
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ScriptDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [scripts]
      operationId: deleteScript
      x-permission: scripts:delete
      description: Fails with 409 while a job uses any version of the script.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [scripts]
      operationId: createScriptVersion
      x-permission: scripts:update
      summary: Add a new (draft) version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                parameters: { type: array, items: { $ref: '#/components/schemas/ScriptParameter' } }
                changeNote: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ScriptVersionFull' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{id}/versions/{version}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Version' }]
    get:
      tags: [scripts]
      operationId: getScriptVersion
      x-permission: scripts:read
      responses:
        '200': { description: Version incl. content, content: { application/json: { schema: { $ref: '#/components/schemas/ScriptVersionFull' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scripts/{id}/versions/{version}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Version' }]
    post:
      tags: [scripts]
      operationId: approveScriptVersion
      x-permission: scripts:approve
      description: draft → approved. With `SCRIPT_SELF_APPROVAL=false` the author cannot approve their own version.
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/ScriptVersionFull' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{id}/versions/{version}/retire:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Version' }]
    post:
      tags: [scripts]
      operationId: retireScriptVersion
      x-permission: scripts:approve
      description: Retired versions cannot be executed any more (jobs using them fail to start).
      responses:
        '200': { description: Retired, content: { application/json: { schema: { $ref: '#/components/schemas/ScriptVersionFull' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{id}/versions/{version}/test:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Version' }]
    post:
      tags: [scripts]
      operationId: testScriptVersion
      x-permission: 'scripts:execute (drafts additionally scripts:approve)'
      summary: Test-run a version on a single device
      description: |
        Approved versions need scripts:execute. A draft is unreviewed code and additionally needs the
        global permission scripts:approve (403 otherwise). Test runs count towards the four-eyes
        threshold; when it is reached the request is refused with 409 `four_eyes_limit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, format: uuid }
                params: { type: object, additionalProperties: true }
                timeoutSeconds: { type: integer, minimum: 10, maximum: 86400, default: 600 }
      responses:
        '201': { description: Run created, content: { application/json: { schema: { $ref: '#/components/schemas/JobRunBase' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{id}/run:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [scripts]
      operationId: runScript
      x-permission: jobs:execute
      summary: Ad-hoc execution of an approved version on any targets (no job is created)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                version: { type: integer, description: default = newest approved version }
                targets: { $ref: '#/components/schemas/JobTargets' }
                params: { type: object, additionalProperties: true }
                timeoutSeconds: { type: integer, minimum: 10, maximum: 86400, default: 3600 }
      responses:
        '201': { description: Run created, content: { application/json: { schema: { $ref: '#/components/schemas/JobRun' } } } }
        '202': { description: Four-eyes approval required (not executed yet), content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalPending' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ M2: jobs
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      x-permission: jobs:read
      responses:
        '200': { description: Jobs, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { allOf: [{ $ref: '#/components/schemas/Job' }, { type: object, required: [stepCount], properties: { stepCount: { type: integer } } }] } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [jobs]
      operationId: createJob
      x-permission: jobs:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JobInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/JobDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [jobs]
      operationId: getJob
      x-permission: jobs:read
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/JobDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [jobs]
      operationId: updateJob
      x-permission: jobs:update
      description: Only the given fields change. `steps` replaces all steps. Running runs keep their snapshot.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JobPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/JobDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [jobs]
      operationId: deleteJob
      x-permission: jobs:delete
      description: Cancels running runs, then deletes the job incl. its run history.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/targets:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [jobs]
      operationId: listJobTargets
      x-permission: jobs:read
      summary: Devices the job would currently run on
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { type: object, required: [id, hostname, os], properties: { id: { type: string, format: uuid }, hostname: { type: string }, os: { $ref: '#/components/schemas/OS' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/run:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [jobs]
      operationId: runJob
      x-permission: jobs:execute
      summary: Start the job now (all targets or a subset)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { deviceIds: { type: array, items: { type: string, format: uuid }, description: restrict to these targets } } } } }
      responses:
        '201': { description: Run created, content: { application/json: { schema: { $ref: '#/components/schemas/JobRun' } } } }
        '202': { description: Four-eyes approval required (not executed yet), content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalPending' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/runs:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [jobs]
      operationId: listJobRuns
      x-permission: jobs:read
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { description: Runs, content: { application/json: { schema: { $ref: '#/components/schemas/JobRunPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ M2: runs & tasks
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      x-permission: jobs:read | scripts:execute
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: jobId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Runs (newest first, incl. test runs), content: { application/json: { schema: { $ref: '#/components/schemas/JobRunPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: getRun
      x-permission: jobs:read | scripts:execute
      responses:
        '200': { description: Run with task counts, content: { application/json: { schema: { $ref: '#/components/schemas/JobRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: listRunTasks
      x-permission: jobs:read | scripts:execute
      responses:
        '200': { description: One task per device, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TaskRow' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [runs]
      operationId: cancelRun
      x-permission: jobs:execute | scripts:execute (test runs)
      description: Pending tasks are cancelled immediately; running tasks receive a cancel request.
      responses:
        '200': { description: Run, content: { application/json: { schema: { $ref: '#/components/schemas/JobRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{id}/rerun:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [runs]
      operationId: rerunRun
      x-permission: jobs:execute | scripts:execute (test runs)
      summary: New run with the same snapshot, for failed (default) or all devices
      requestBody:
        content: { application/json: { schema: { type: object, properties: { onlyFailed: { type: boolean, default: true } } } } }
      responses:
        '201': { description: New run, content: { application/json: { schema: { $ref: '#/components/schemas/JobRun' } } } }
        '202': { description: Four-eyes approval required (not executed yet), content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalPending' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: getTask
      x-permission: jobs:read | scripts:execute
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/output:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runs]
      operationId: getTaskOutput
      x-permission: jobs:read | scripts:execute
      summary: Output chunks after a cursor (poll with `after=nextCursor` until `done`)
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        '200':
          description: Chunks
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, status, done]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, stream, data, at]
                      properties:
                        id: { type: integer }
                        stream: { type: string, enum: [stdout, stderr, system] }
                        data: { type: string }
                        at: { type: string, format: date-time }
                  nextCursor: { type: integer }
                  status: { $ref: '#/components/schemas/TaskStatus' }
                  done: { type: boolean, description: task finished and all output delivered }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [runs]
      operationId: cancelTask
      x-permission: jobs:execute | scripts:execute (test runs)
      responses:
        '200':
          description: Cancelled or cancel requested
          content: { application/json: { schema: { type: object, required: [id, status, cancelRequested], properties: { id: { type: string }, status: { $ref: '#/components/schemas/TaskStatus' }, cancelRequested: { type: boolean } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ M3: vulnerabilities
  /vulnerabilities/summary:
    get:
      tags: [vulnerabilities]
      operationId: getVulnerabilitySummary
      x-permission: vulnerabilities:read
      summary: Open findings by severity, KEV, mirror size and feed status (accepted risks excluded)
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/VulnSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vulnerabilities:
    get:
      tags: [vulnerabilities]
      operationId: listVulnerabilities
      x-permission: vulnerabilities:read
      summary: CVEs with open findings, ordered by risk (KEV, CVSS, EPSS, affected devices)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: severity, in: query, schema: { type: string }, description: 'comma separated: CRITICAL,HIGH,MEDIUM,LOW,NONE' }
        - { name: confidence, in: query, schema: { type: string }, description: 'comma separated: high,medium,low' }
        - { name: kev, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: search, in: query, schema: { type: string }, description: 'CVE id, description, product or software name' }
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: includeAccepted, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
      responses:
        '200':
          description: Page of CVEs
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/VulnBase'
                        - type: object
                          required: [affectedDevices, products, confidence]
                          properties:
                            affectedDevices: { type: integer }
                            products: { type: array, items: { type: string }, description: 'vendor:product' }
                            confidence: { $ref: '#/components/schemas/Confidence' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vulnerabilities/{cveId}:
    parameters: [{ $ref: '#/components/parameters/CveId' }]
    get:
      tags: [vulnerabilities]
      operationId: getVulnerability
      x-permission: vulnerabilities:read
      responses:
        '200':
          description: CVE with affected devices (open and fixed findings)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VulnBase'
                  - type: object
                    required: [cwes, refs, affected, vulnStatus]
                    properties:
                      vulnStatus: { type: string }
                      cwes: { type: array, items: { type: string } }
                      refs: { type: array, items: { type: object, required: [url, tags], properties: { url: { type: string }, tags: { type: array, items: { type: string } } } } }
                      kevRequiredAction: { type: [string, 'null'] }
                      affected:
                        type: array
                        items:
                          type: object
                          required: [deviceId, hostname, os, softwareName, softwareVersion, vendor, product, confidence, status, firstSeen, lastSeen]
                          properties:
                            deviceId: { type: string, format: uuid }
                            hostname: { type: string }
                            os: { $ref: '#/components/schemas/OS' }
                            softwareName: { type: string }
                            softwareVersion: { type: string }
                            vendor: { type: string }
                            product: { type: string }
                            confidence: { $ref: '#/components/schemas/Confidence' }
                            status: { type: string, enum: [open, fixed] }
                            firstSeen: { type: string, format: date-time }
                            lastSeen: { type: string, format: date-time }
                            fixedAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [vulnerabilities]
      operationId: acceptVulnerability
      x-permission: vulnerabilities:update
      summary: Accept (or un-accept) the risk of a CVE fleet-wide – accepted CVEs are hidden by default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted: { type: boolean }
                reason: { type: string, description: required when accepting }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/VulnBase' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vulnerabilities/{cveId}/remediation:
    parameters: [{ $ref: '#/components/parameters/CveId' }]
    post:
      tags: [vulnerabilities]
      operationId: createRemediationJob
      x-permission: jobs:create (+ jobs:execute for runNow)
      summary: Create a job with an approved script targeting all devices with open findings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scriptId]
              properties:
                scriptId: { type: string, format: uuid }
                version: { type: integer }
                params: { type: object, additionalProperties: true }
                name: { type: string }
                deviceIds: { type: array, items: { type: string, format: uuid }, description: restrict to these affected devices }
                runNow: { type: boolean, default: false }
                timeoutSeconds: { type: integer, default: 3600 }
      responses:
        '201':
          description: Job created
          content: { application/json: { schema: { type: object, required: [jobId, devices], properties: { jobId: { type: string, format: uuid }, runId: { type: [string, 'null'], format: uuid }, approvalId: { type: [string, 'null'], format: uuid, description: set when runNow needs four-eyes approval }, devices: { type: integer } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /devices/{id}/vulnerabilities:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [vulnerabilities]
      operationId: listDeviceVulnerabilities
      x-permission: vulnerabilities:read
      parameters: [{ name: status, in: query, schema: { type: string, enum: [open, fixed, all], default: open } }]
      responses:
        '200':
          description: Findings of the device
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/VulnBase'
                        - type: object
                          required: [softwareName, softwareVersion, vendor, product, confidence, status, firstSeen]
                          properties:
                            softwareName: { type: string }
                            softwareVersion: { type: string }
                            vendor: { type: string }
                            product: { type: string }
                            confidence: { $ref: '#/components/schemas/Confidence' }
                            status: { type: string, enum: [open, fixed] }
                            firstSeen: { type: string, format: date-time }
                            fixedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /software:
    get:
      tags: [vulnerabilities]
      operationId: listFleetSoftware
      x-permission: inventory:read
      summary: Software across all active devices with its CPE mapping (and suggestions for unmapped entries)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: search, in: query, schema: { type: string } }
        - { name: mapping, in: query, schema: { type: string, enum: [all, mapped, unmapped, ignored], default: all } }
      responses:
        '200':
          description: Software
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, publisher, source, deviceCount, versions, suggestions]
                      properties:
                        name: { type: string }
                        publisher: { type: string }
                        source: { type: string }
                        deviceCount: { type: integer }
                        versions: { type: array, items: { type: string } }
                        mapping:
                          oneOf:
                            - type: 'null'
                            - type: object
                              required: [vendor, product, method, confidence]
                              properties:
                                vendor: { type: string }
                                product: { type: string }
                                method: { type: string, enum: [rule, heuristic] }
                                ruleId: { type: [string, 'null'] }
                                confidence: { $ref: '#/components/schemas/Confidence' }
                            - type: object
                              required: [ignored, ruleId]
                              properties:
                                ignored: { type: boolean }
                                ruleId: { type: string }
                        suggestions: { type: array, items: { type: object, required: [vendor, product], properties: { vendor: { type: string }, product: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cpe-rules:
    get:
      tags: [vulnerabilities]
      operationId: listCpeRules
      x-permission: vulnerabilities:read
      responses:
        '200': { description: Rules (built-in and user), content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CpeRule' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [vulnerabilities]
      operationId: createCpeRule
      x-permission: vulnerabilities:update
      description: Patterns are case-insensitive globs over the whole name (`*`, `?`). Triggers a full re-evaluation.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CpeRuleInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CpeRule' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cpe-rules/test:
    post:
      tags: [vulnerabilities]
      operationId: testCpeRule
      x-permission: vulnerabilities:read
      summary: Which installed software would a pattern match?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namePattern]
              properties:
                namePattern: { type: string }
                publisherPattern: { type: [string, 'null'] }
                source: { type: [string, 'null'] }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { type: object, required: [name, publisher, source], properties: { name: { type: string }, publisher: { type: string }, source: { type: string } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cpe-rules/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [vulnerabilities]
      operationId: updateCpeRule
      x-permission: vulnerabilities:update
      description: Built-in rules can only be enabled/disabled or re-prioritised.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CpeRuleInput' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CpeRule' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [vulnerabilities]
      operationId: deleteCpeRule
      x-permission: vulnerabilities:update
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vulnerability-feeds:
    get:
      tags: [vulnerabilities]
      operationId: listVulnerabilityFeeds
      x-permission: vulnerabilities:read
      responses:
        '200':
          description: Feed state
          content:
            application/json:
              schema:
                type: object
                required: [enabled, items]
                properties:
                  enabled: { type: boolean }
                  items: { type: array, items: { $ref: '#/components/schemas/FeedState' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vulnerability-feeds/sync:
    post:
      tags: [vulnerabilities]
      operationId: requestVulnerabilitySync
      x-permission: vulnerabilities:update
      summary: Request a sync (picked up by the worker within a minute) and a full re-evaluation
      requestBody:
        content: { application/json: { schema: { type: object, properties: { feeds: { type: array, items: { type: string, enum: [nvd, kev, epss, osv] } } } } } }
      responses:
        '202': { description: Requested, content: { application/json: { schema: { type: object, required: [requested], properties: { requested: { type: array, items: { type: string } } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /script-templates:
    get:
      tags: [scripts]
      operationId: listScriptTemplates
      x-permission: scripts:read
      summary: Built-in script templates (e.g. remediation); import them as a draft script
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, description, interpreter, category, parameters, content]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        interpreter: { $ref: '#/components/schemas/Interpreter' }
                        category: { type: string, enum: [remediation, maintenance] }
                        parameters: { type: array, items: { $ref: '#/components/schemas/ScriptParameter' } }
                        content: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ M5: software distribution
  /packages:
    get:
      tags: [software]
      operationId: listPackages
      x-permission: software:read
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { $ref: '#/components/schemas/Platform' } }
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Package'
                        - type: object
                          required: [versionCount, latestVersion, approvedVersion, type]
                          properties:
                            versionCount: { type: integer }
                            latestVersion: { type: [string, 'null'] }
                            approvedVersion: { type: [string, 'null'] }
                            type: { oneOf: [{ $ref: '#/components/schemas/PackageType' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [software]
      operationId: createPackage
      x-permission: software:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, platform]
              properties:
                name: { type: string, maxLength: 150 }
                publisher: { type: string }
                description: { type: string }
                platform: { $ref: '#/components/schemas/Platform' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PackageDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [software]
      operationId: getPackage
      x-permission: software:read
      responses:
        '200': { description: Package with versions, content: { application/json: { schema: { $ref: '#/components/schemas/PackageDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [software]
      operationId: updatePackage
      x-permission: software:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                publisher: { type: string }
                description: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Package' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [software]
      operationId: deletePackage
      x-permission: software:delete
      description: Only packages that were never deployed; otherwise retire their versions.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [software]
      operationId: createPackageVersion
      x-permission: software:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersionInput' } } }
      responses:
        '201': { description: Draft version, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersion' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}/versions/{versionId}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/VersionId' }]
    patch:
      tags: [software]
      operationId: updatePackageVersion
      x-permission: software:update
      description: Drafts only – approved versions are immutable (also enforced by a database trigger).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersionPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersion' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [software]
      operationId: deletePackageVersion
      x-permission: software:delete
      description: Drafts only. The installer file is removed when no other version uses it.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}/versions/{versionId}/file:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/VersionId' }]
    put:
      tags: [software]
      operationId: uploadPackageFile
      x-permission: software:update
      summary: Upload the installer file (streamed, SHA-256 computed on the server, deduplicated)
      parameters:
        - { name: name, in: query, required: true, description: original file name, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersion' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: File larger than PACKAGE_MAX_BYTES, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Content type must be application/octet-stream, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /packages/{id}/versions/{versionId}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/VersionId' }]
    post:
      tags: [software]
      operationId: approvePackageVersion
      x-permission: software:approve
      description: draft → approved after a full validation (file present). With `SCRIPT_SELF_APPROVAL=false` the author cannot approve.
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}/versions/{versionId}/retire:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/VersionId' }]
    post:
      tags: [software]
      operationId: retirePackageVersion
      x-permission: software:approve
      responses:
        '200': { description: Retired, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}/versions/{versionId}/script:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/VersionId' }]
    get:
      tags: [software]
      operationId: previewPackageScript
      x-permission: software:read
      summary: The generated script that the agent will run
      parameters:
        - { name: action, in: query, schema: { type: string, enum: [install, uninstall], default: install } }
      responses:
        '200':
          description: Generated script
          content:
            application/json:
              schema:
                type: object
                required: [interpreter, content, files]
                properties:
                  interpreter: { type: string, enum: [powershell, bash] }
                  content: { type: string }
                  files: { type: array, items: { $ref: '#/components/schemas/RunFile' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /packages/{id}/compliance:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [software]
      operationId: getPackageCompliance
      x-permission: software:read
      summary: Installation state per device (inventory-based detection of the newest approved version + last deployment result)
      responses:
        '200':
          description: Compliance
          content:
            application/json:
              schema:
                type: object
                required: [packageId, version, summary, items]
                properties:
                  packageId: { type: string, format: uuid }
                  version: { type: [string, 'null'] }
                  summary:
                    type: object
                    required: [devices, installed, missing, unknown, failed]
                    properties:
                      devices: { type: integer }
                      installed: { type: integer }
                      missing: { type: integer }
                      unknown: { type: integer }
                      failed: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [deviceId, hostname, installed, lastDeployment]
                      properties:
                        deviceId: { type: string, format: uuid }
                        hostname: { type: string }
                        installed: { type: [boolean, 'null'], description: null = not determinable from the inventory }
                        lastDeployment:
                          type: [object, 'null']
                          required: [status, action, version]
                          properties:
                            status: { type: string }
                            action: { type: string, enum: [install, uninstall] }
                            version: { type: string }
                            finishedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      x-permission: 'software:read | patches:read'
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [package, os_updates] } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Deployments (only kinds the caller may read)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/DeploymentBase'
                        - type: object
                          required: [ringCount, currentRingName, progress]
                          properties:
                            ringCount: { type: integer }
                            currentRingName: { type: [string, 'null'] }
                            progress:
                              type: object
                              required: [total, succeeded, failed]
                              properties:
                                total: { type: integer }
                                succeeded: { type: integer }
                                failed: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [deployments]
      operationId: createDeployment
      x-permission: 'software:execute (package) | patches:execute (os_updates)'
      summary: Start a ring-based deployment of a package version or of OS updates
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentInput' } } }
      responses:
        '201': { description: Started (ring 1 running), content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '202':
          description: Four-eyes approval required – the deployment starts once a second person approves
          content:
            application/json:
              schema:
                type: object
                required: [approvalRequired, approvalId, devices, deployment]
                properties:
                  approvalRequired: { type: boolean, enum: [true] }
                  approvalId: { type: string, format: uuid }
                  devices: { type: integer }
                  deployment: { $ref: '#/components/schemas/Deployment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /deployments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [deployments]
      operationId: getDeployment
      x-permission: 'software:read | patches:read'
      responses:
        '200': { description: Deployment with ring statistics, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deployments/{id}/promote:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [deployments]
      operationId: promoteDeployment
      x-permission: 'software:execute | patches:execute'
      description: Starts the next ring now (ignores delay and success quota). The current ring must be finished.
      responses:
        '200': { description: Promoted (or completed after the last ring), content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /deployments/{id}/pause:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [deployments]
      operationId: pauseDeployment
      x-permission: 'software:execute | patches:execute'
      description: Stops automatic promotion; tasks of the current ring keep running.
      responses:
        '200': { description: Paused, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /deployments/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [deployments]
      operationId: resumeDeployment
      x-permission: 'software:execute | patches:execute'
      responses:
        '200': { description: Running again, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /deployments/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [deployments]
      operationId: cancelDeployment
      x-permission: 'software:execute | patches:execute'
      description: Cancels open tasks and prevents further rings.
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ M5: patch management
  /patches/summary:
    get:
      tags: [patches]
      operationId: getPatchSummary
      x-permission: patches:read
      responses:
        '200': { description: Fleet patch state (within the caller's scope), content: { application/json: { schema: { $ref: '#/components/schemas/PatchSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patches/devices:
    get:
      tags: [patches]
      operationId: listPatchDevices
      x-permission: patches:read
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [all, missing, security, reboot, never, failed], default: all } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Patch state per device (most critical first)
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PatchDevice' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patches/updates:
    get:
      tags: [patches]
      operationId: listPatchUpdates
      x-permission: patches:read
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: security, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Pending updates aggregated over devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [updateId, source, title, security, devices]
                      properties:
                        updateId: { type: string }
                        source: { $ref: '#/components/schemas/PatchSource' }
                        title: { type: string }
                        kb: { type: [string, 'null'] }
                        classification: { type: string }
                        severity: { type: string }
                        security: { type: boolean }
                        rebootRequired: { type: boolean }
                        firstDetectedAt: { type: string, format: date-time }
                        devices: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patches/scan:
    post:
      tags: [patches]
      operationId: startPatchScan
      x-permission: patches:execute
      summary: Scan devices for pending updates now (one run per operating system)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: { $ref: '#/components/schemas/JobTargets' }
      responses:
        '202':
          description: Scan runs created
          content:
            application/json:
              schema:
                type: object
                required: [runIds, devices]
                properties:
                  runIds: { type: array, items: { type: string, format: uuid } }
                  devices: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /patches/export:
    get:
      tags: [patches]
      operationId: exportPatchState
      x-permission: patches:read
      summary: Patch state per device as CSV (Excel, `;`, UTF-8 BOM) or JSON
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        '200':
          description: Export
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/{id}/patches:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [patches]
      operationId: getDevicePatches
      x-permission: patches:read
      responses:
        '200':
          description: Scan state and pending updates of a device
          content:
            application/json:
              schema:
                type: object
                required: [state, items]
                properties:
                  state: { $ref: '#/components/schemas/PatchState' }
                  items: { type: array, items: { $ref: '#/components/schemas/DevicePatch' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ M6: dashboard & reports
  /dashboard:
    get:
      tags: [reports]
      operationId: getDashboard
      x-permission: 'any – sections depend on the caller''s read permissions and device scope'
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 365, default: 30 }, description: trend length }
      responses:
        '200': { description: Key figures and trends, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /report-sources:
    get:
      tags: [reports]
      operationId: listReportSources
      x-permission: 'reports:read (only sources whose read permission the caller holds)'
      responses:
        '200':
          description: Data sources with their columns
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReportSource' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/preview:
    post:
      tags: [reports]
      operationId: previewReport
      x-permission: 'reports:read + read permission of the source'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ReportDefinition'
                - type: object
                  properties:
                    limit: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/ReportResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports:
    get:
      tags: [reports]
      operationId: listReports
      x-permission: reports:read
      description: Own reports and reports shared by others.
      responses:
        '200': { description: Reports, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Report' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reports]
      operationId: createReport
      x-permission: 'reports:create + read permission of the source'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ReportDefinition'
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 150 }
                    description: { type: string }
                    shared: { type: boolean, default: false }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [reports]
      operationId: getReport
      x-permission: reports:read
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [reports]
      operationId: updateReport
      x-permission: 'reports:read (owner) | reports:update'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                shared: { type: boolean }
                source: { type: string }
                columns: { type: array, items: { type: string } }
                filters: { type: array, items: { $ref: '#/components/schemas/ReportFilter' } }
                sort: { oneOf: [{ $ref: '#/components/schemas/ReportSort' }, { type: 'null' }] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [reports]
      operationId: deleteReport
      x-permission: 'reports:read (owner) | reports:delete'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/{id}/run:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [reports]
      operationId: runReport
      x-permission: 'reports:read + read permission of the source'
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 10000 } }
      responses:
        '200':
          description: Result (CSV for Excel – `;`, UTF-8 BOM, formula injection neutralised)
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReportResult' } }
            text/csv: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ M6: webhooks
  /webhook-events:
    get:
      tags: [webhooks]
      operationId: listWebhookEvents
      x-permission: webhooks:read
      responses:
        '200':
          description: Event catalogue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, required: [name, label], properties: { name: { type: string }, label: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      x-permission: webhooks:read
      responses:
        '200': { description: Webhooks (without secrets), content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Webhook' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [webhooks]
      operationId: createWebhook
      x-permission: webhooks:create
      description: |
        Deliveries are POST requests with the headers X-OpenCM-Event, X-OpenCM-Delivery, X-OpenCM-Timestamp and
        X-OpenCM-Signature = "sha256=" + HMAC-SHA256(secret, timestamp + "." + body). Without `secret` one is
        generated; it is returned only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string }
                url: { type: string, description: 'https (http only with WEBHOOK_ALLOW_HTTP); link-local/metadata targets are refused' }
                events: { type: array, items: { type: string }, description: 'event names or "*"' }
                enabled: { type: boolean, default: true }
                secret: { type: string, minLength: 16 }
      responses:
        '201': { description: Created (incl. secret), content: { application/json: { schema: { $ref: '#/components/schemas/WebhookWithSecret' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      x-permission: webhooks:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                url: { type: string }
                events: { type: array, items: { type: string } }
                enabled: { type: boolean }
                rotateSecret: { type: boolean, description: generate a new secret (returned once) }
                secret: { type: string, minLength: 16 }
      responses:
        '200': { description: Updated (incl. secret if rotated), content: { application/json: { schema: { $ref: '#/components/schemas/WebhookWithSecret' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      x-permission: webhooks:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{id}/test:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [webhooks]
      operationId: testWebhook
      x-permission: webhooks:update
      summary: Send a test event immediately
      responses:
        '200': { description: Delivery result, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDelivery' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{id}/deliveries:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      x-permission: webhooks:read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, succeeded, failed] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: Delivery log, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhook-deliveries/{id}/redeliver:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [webhooks]
      operationId: redeliverWebhook
      x-permission: webhooks:update
      responses:
        '200': { description: Queued again, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDelivery' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ M6: licenses
  /licenses:
    get:
      tags: [licenses]
      operationId: listLicenses
      x-permission: licenses:read
      responses:
        '200': { description: Licenses with usage, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/License' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [licenses]
      operationId: createLicense
      x-permission: licenses:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LicenseInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LicenseDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /licenses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [licenses]
      operationId: getLicense
      x-permission: licenses:read
      responses:
        '200': { description: License with devices, content: { application/json: { schema: { $ref: '#/components/schemas/LicenseDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [licenses]
      operationId: updateLicense
      x-permission: licenses:update
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LicensePatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/LicenseDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [licenses]
      operationId: deleteLicense
      x-permission: licenses:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ M7: security status
  /security-status:
    get:
      tags: [security-status]
      operationId: listSecurityStatus
      x-permission: inventory:read (device scope)
      description: Fleet overview, problems first (not compliant → not reported → compliant).
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: os, in: query, schema: { type: string, enum: [windows, linux, macos] } }
        - { name: compliant, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: reported, in: query, schema: { type: string, enum: ['true', 'false'] }, description: false = agent has not reported a status yet }
        - { name: encryption, in: query, schema: { type: string, enum: [encrypted, partial, unencrypted, unknown] } }
        - { name: antivirus, in: query, schema: { type: string, enum: [ok, outdated, disabled, missing, unknown] } }
        - { name: firewall, in: query, schema: { type: string, enum: [on, partial, off, unknown] } }
        - { name: issue, in: query, schema: { type: string }, description: issue code (see issueLabels) }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Status per device (CSV for Excel with format=csv)
          content:
            application/json:
              schema:
                type: object
                required: [summary, issueLabels, items, total]
                properties:
                  summary: { $ref: '#/components/schemas/SecuritySummary' }
                  issueLabels: { type: object, additionalProperties: { type: string } }
                  items: { type: array, items: { $ref: '#/components/schemas/DeviceSecurityRow' } }
                  total: { type: integer }
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/{id}/security:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [security-status]
      operationId: getDeviceSecurity
      x-permission: inventory:read (device scope)
      responses:
        '200': { description: Security status with the raw details reported by the agent, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceSecurity' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Device unknown or no status reported yet (older agent), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ------------------------------------------------------------------ M7: assets
  /asset-types:
    get:
      tags: [assets]
      operationId: listAssetTypes
      x-permission: assets:read
      responses:
        '200':
          description: Types and statuses with labels
          content:
            application/json:
              schema:
                type: object
                required: [types, statuses]
                properties:
                  types: { type: array, items: { $ref: '#/components/schemas/KeyLabel' } }
                  statuses: { type: array, items: { $ref: '#/components/schemas/KeyLabel' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assets:
    get:
      tags: [assets]
      operationId: listAssets
      x-permission: assets:read
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 }, description: 'name, serial/inventory number, model, manufacturer, person, location, IP, device' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AssetType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssetStatus' } }
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: warrantyDays, in: query, schema: { type: integer, minimum: 0, maximum: 3650 }, description: warranty ends within N days (expired included; retired excluded) }
        - { name: includeRetired, in: query, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
        - { name: sort, in: query, schema: { type: string, enum: [name, type, warrantyUntil, updatedAt, inventoryNumber], default: name } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: 'csv: same columns as the import (";", UTF-8 BOM)' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Assets
          content:
            application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: '#/components/schemas/Asset' } }, total: { type: integer } } } }
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [assets]
      operationId: createAsset
      x-permission: assets:create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /assets/import:
    post:
      tags: [assets]
      operationId: importAssets
      x-permission: assets:create + assets:update
      description: |
        CSV import (";" , "," or tab – detected from the header; English keys or German column names).
        Rows are matched by inventory number, otherwise by serial number; others are created. Invalid rows
        are reported and skipped. Dates as YYYY-MM-DD or DD.MM.YYYY, amounts as 1234.56 or 1.234,56.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, maxLength: 5242880 }
                dryRun: { type: boolean, default: false, description: only validate }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/AssetImportResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assets/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [assets]
      operationId: getAsset
      x-permission: assets:read
      responses:
        '200': { description: Asset, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [assets]
      operationId: updateAsset
      x-permission: assets:update
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [assets]
      operationId: deleteAsset
      x-permission: assets:delete
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{id}/assets:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [assets]
      operationId: listDeviceAssets
      x-permission: assets:read + devices:read (device scope)
      description: Assets linked to a managed device (e.g. its monitors).
      responses:
        '200': { description: Assets, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Asset' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: opencm_session }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    CveId: { name: cveId, in: path, required: true, schema: { type: string, pattern: '^CVE-\d{4}-\d{4,}$', example: CVE-2021-44228 } }

  responses:
    ValidationError:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing/invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Missing permission
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflict (duplicate name, protected object, …)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    Health:
      type: object
      required: [status, version, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        database: { type: string, enum: [ok, unreachable] }

    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Me:
      type: object
      required: [id, username, displayName, permissions, scoped, mfaSetupRequired, via]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        authSource: { type: string, enum: [local, ldap, oidc] }
        mfaEnabled: { type: boolean }
        permissions: { type: array, items: { type: string }, description: Global effective grants (may contain wildcards) }
        scoped:
          type: array
          description: Grants restricted to devices of the listed device groups
          items: { type: object, required: [permissions, deviceGroupIds], properties: { permissions: { type: array, items: { type: string } }, deviceGroupIds: { type: array, items: { type: string, format: uuid } } } }
        mfaSetupRequired: { type: boolean }
        via: { type: string, enum: [session, token] }

    RoleAssignment:
      type: object
      required: [roleId]
      properties:
        roleId: { type: string, format: uuid }
        scopeDeviceGroupIds: { type: [array, 'null'], items: { type: string, format: uuid }, description: 'null = global; otherwise the role only applies to devices in these groups' }

    AssignedRole:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopeDeviceGroupIds: { type: [array, 'null'], items: { type: string, format: uuid } }

    User:
      type: object
      required: [id, username, displayName, authSource, isActive, mfaEnabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        authSource: { type: string, enum: [local, ldap, oidc] }
        isActive: { type: boolean }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [roles, groups]
          properties:
            roles: { type: array, items: { $ref: '#/components/schemas/AssignedRole' } }
            groups: { type: array, items: { $ref: '#/components/schemas/Ref' } }

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._@-]+$', maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        password: { type: string, minLength: 12, format: password }
        isActive: { type: boolean, default: true }
        roleIds: { type: array, items: { type: string, format: uuid }, description: global role assignments (shortcut) }
        roleAssignments: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        groupIds: { type: array, items: { type: string, format: uuid } }

    UserUpdate:
      type: object
      properties:
        displayName: { type: string, maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        password: { type: string, minLength: 12, format: password, description: local accounts only }
        isActive: { type: boolean }
        roleIds: { type: array, items: { type: string, format: uuid } }
        roleAssignments: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        groupIds: { type: array, items: { type: string, format: uuid } }

    Group:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ldapGroup: { type: [string, 'null'], description: DN of the LDAP/AD group synced into this group at login }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [roles, members]
          properties:
            roles: { type: array, items: { $ref: '#/components/schemas/AssignedRole' } }
            members:
              type: array
              items:
                type: object
                required: [id, username]
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }

    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        roleIds: { type: array, items: { type: string, format: uuid } }
        roleAssignments: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        memberIds: { type: array, items: { type: string, format: uuid } }
        ldapGroup: { type: [string, 'null'] }

    GroupUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        roleIds: { type: array, items: { type: string, format: uuid } }
        roleAssignments: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        memberIds: { type: array, items: { type: string, format: uuid } }
        ldapGroup: { type: [string, 'null'] }

    OtpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 6-digit TOTP code (or recovery code where accepted) }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string } }

    ApiTokenBase:
      type: object
      required: [id, name, permissions, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        permissions: { type: array, items: { type: string }, description: empty = owner's rights }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    ApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiTokenBase'
        - type: object
          required: [userId, username]
          properties:
            userId: { type: string, format: uuid }
            username: { type: string }
            lastUsedAt: { type: [string, 'null'], format: date-time }
            revokedAt: { type: [string, 'null'], format: date-time }

    Approval:
      type: object
      required: [id, action, summary, status, deviceCount, requestedAt, expiresAt, canDecide]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [job.run, script.run, remediation.run, run.rerun, job.enable, deployment.start] }
        summary: { type: string }
        payload: { type: object }
        deviceCount: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, expired, failed] }
        requestedBy: { type: [string, 'null'], format: uuid }
        requesterName: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        result: { type: [object, 'null'], description: '{ runId } / { jobId, enabled } or { error }' }
        canDecide: { type: boolean }

    ApprovalPending:
      type: object
      required: [approvalRequired, approvalId, devices]
      description: Four-eyes – the action was not executed; it waits for approval by a second person.
      properties:
        approvalRequired: { type: boolean, enum: [true] }
        approvalId: { type: string, format: uuid }
        devices: { type: integer }

    SecuritySettings:
      type: object
      required: [mfaRequired, fourEyes, ldap]
      properties:
        mfaRequired: { type: boolean }
        fourEyes: { type: object, required: [enabled, deviceThreshold], properties: { enabled: { type: boolean }, deviceThreshold: { type: integer } } }
        ldap: { type: object, required: [enabled, url, requireGroup], properties: { enabled: { type: boolean }, url: { type: [string, 'null'] }, requireGroup: { type: boolean } } }

    Role:
      type: object
      required: [id, name, description, permissions, isSystem, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string }, example: ['devices:read', 'jobs:*'] }
        isSystem: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RoleCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, items: { type: string } }

    RoleUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions: { type: array, items: { type: string } }

    OS:
      type: string
      enum: [windows, linux, macos]

    Device:
      type: object
      required: [id, hostname, os, osVersion, arch, status, online, enrolledAt]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        os: { $ref: '#/components/schemas/OS' }
        osVersion: { type: string }
        arch: { type: string }
        agentVersion: { type: [string, 'null'] }
        status: { type: string, enum: [active, revoked] }
        online: { type: boolean, description: Checked in within 3 heartbeat intervals }
        manufacturer: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        serialNumber: { type: [string, 'null'] }
        loggedOnUser: { type: [string, 'null'] }
        lastIp: { type: [string, 'null'] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastInventoryAt: { type: [string, 'null'], format: date-time }
        enrolledAt: { type: string, format: date-time }

    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [groups, inventoryRequested]
          properties:
            certExpiresAt: { type: [string, 'null'], format: date-time }
            certSerial: { type: [string, 'null'] }
            inventoryRequested: { type: boolean }
            groups: { type: array, items: { $ref: '#/components/schemas/Ref' } }

    Software:
      type: object
      required: [name, version, publisher, source, arch]
      properties:
        name: { type: string }
        version: { type: string }
        publisher: { type: string }
        installDate: { type: [string, 'null'] }
        source: { type: string, description: 'registry, msi, dpkg, rpm, app, …' }
        arch: { type: string }

    HistoryEntry:
      type: object
      required: [id, at, category, change, itemKey]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        category: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        itemKey: { type: string }
        oldValue: {}
        newValue: {}

    InventorySnapshot:
      type: object
      required: [collectedAt, receivedAt, hardware, os, disks, network, patches, services, autostart, localUsers, localGroups, loggedOnUsers]
      properties:
        collectedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        hardware:
          type: object
          properties:
            manufacturer: { type: [string, 'null'] }
            model: { type: [string, 'null'] }
            serialNumber: { type: [string, 'null'] }
            chassis: { type: [string, 'null'] }
            biosVendor: { type: [string, 'null'] }
            biosVersion: { type: [string, 'null'] }
            biosDate: { type: [string, 'null'] }
            cpu:
              type: object
              properties:
                model: { type: [string, 'null'] }
                cores: { type: [number, 'null'] }
                logicalProcessors: { type: [number, 'null'] }
                mhz: { type: [number, 'null'] }
            memoryBytes: { type: [number, 'null'] }
        os:
          type: object
          properties:
            name: { type: [string, 'null'] }
            version: { type: [string, 'null'] }
            build: { type: [string, 'null'] }
            arch: { type: [string, 'null'] }
            kernel: { type: [string, 'null'] }
            installDate: { type: [string, 'null'] }
            lastBoot: { type: [string, 'null'] }
            distroId: { type: [string, 'null'], description: 'Linux: ID from /etc/os-release' }
        disks:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              mount: { type: [string, 'null'] }
              fsType: { type: [string, 'null'] }
              sizeBytes: { type: [number, 'null'] }
              freeBytes: { type: [number, 'null'] }
        network:
          type: array
          items:
            type: object
            required: [name, up, ipv4, ipv6]
            properties:
              name: { type: string }
              mac: { type: [string, 'null'] }
              up: { type: boolean }
              ipv4: { type: array, items: { type: string } }
              ipv6: { type: array, items: { type: string } }
        patches:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              description: { type: [string, 'null'] }
              installedOn: { type: [string, 'null'] }
        services:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              displayName: { type: [string, 'null'] }
              state: { type: [string, 'null'] }
              startMode: { type: [string, 'null'] }
        autostart:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              command: { type: [string, 'null'] }
              location: { type: [string, 'null'] }
        localUsers:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              fullName: { type: [string, 'null'] }
              disabled: { type: [boolean, 'null'] }
              uid: { type: [string, 'null'] }
        localGroups:
          type: array
          items:
            type: object
            required: [name, members]
            properties:
              name: { type: string }
              members: { type: array, items: { type: string } }
        loggedOnUsers: { type: array, items: { type: string } }
        security: { oneOf: [{ $ref: '#/components/schemas/SecurityDetails' }, { type: 'null' }] }

    EnrollmentToken:
      type: object
      required: [id, name, uses, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdBy: { type: [string, 'null'], format: uuid }
        deviceGroupId: { type: [string, 'null'], format: uuid }
        maxUses: { type: [integer, 'null'] }
        uses: { type: integer }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- M2
    DeviceRef:
      type: object
      required: [id, hostname, os, osVersion]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        os: { $ref: '#/components/schemas/OS' }
        osVersion: { type: string }
        loggedOnUser: { type: [string, 'null'] }
        lastSeenAt: { type: [string, 'null'], format: date-time }

    DeviceRefPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeviceRef' } }
        total: { type: integer }

    GroupFilter:
      type: object
      required: [rules]
      description: |
        Fields: hostname, os, osVersion, arch, manufacturer, model, serialNumber, agentVersion, loggedOnUser
        (ops eq, ne, contains, startsWith, in, exists, notExists – case-insensitive), online (eq true/false),
        software (installed / notInstalled, substring of the name), custom:<field> (eq, ne, contains, gt, lt, exists, notExists).
        Security status (M7): encryption (encrypted|partial|unencrypted|unknown), antivirus (ok|outdated|disabled|missing|unknown),
        firewall (on|partial|off|unknown) with the text ops, securityCompliant (eq true/false).
      properties:
        match: { type: string, enum: [all, any], default: all }
        rules:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [field, op]
            properties:
              field: { type: string, example: os }
              op: { type: string, example: eq }
              value: { type: [string, number, boolean, array], items: { type: string } }

    DeviceGroup:
      type: object
      required: [id, name, description, kind, memberCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [static, dynamic] }
        filter: { oneOf: [{ $ref: '#/components/schemas/GroupFilter' }, { type: 'null' }] }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomField:
      type: object
      required: [id, name, label, type, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        type: { type: string, enum: [string, number, boolean, date] }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    CustomFieldValue:
      type: object
      required: [fieldId, name, label, type]
      properties:
        fieldId: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        type: { type: string }
        value: { type: [string, 'null'] }
        source: { type: [string, 'null'], enum: [manual, script, null] }
        updatedAt: { type: [string, 'null'], format: date-time }

    Interpreter:
      type: string
      enum: [powershell, cmd, bash, zsh, python]

    ScriptParameter:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$' }
        label: { type: string }
        type: { type: string, enum: [string, number, boolean] }
        required: { type: boolean, default: false }
        default: { type: [string, number, boolean, 'null'] }

    Script:
      type: object
      required: [id, name, description, interpreter, latestVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        interpreter: { $ref: '#/components/schemas/Interpreter' }
        createdBy: { type: [string, 'null'], format: uuid }
        latestVersion: { type: integer }
        approvedVersion: { type: [integer, 'null'], description: newest approved version }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScriptVersion:
      type: object
      required: [id, version, sha256, status, changeNote, parameters, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [draft, approved, retired] }
        changeNote: { type: string }
        parameters: { type: array, items: { $ref: '#/components/schemas/ScriptParameter' } }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }

    ScriptVersionFull:
      allOf:
        - $ref: '#/components/schemas/ScriptVersion'
        - type: object
          required: [content, scriptId]
          properties:
            content: { type: string }
            scriptId: { type: string, format: uuid }

    ScriptDetail:
      allOf:
        - $ref: '#/components/schemas/Script'
        - type: object
          required: [versions]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/ScriptVersion' } }

    JobTrigger:
      type: string
      enum: [manual, once, cron, agent_start, user_login]

    JobTargets:
      type: object
      properties:
        deviceIds: { type: array, items: { type: string, format: uuid } }
        groupIds: { type: array, items: { type: string, format: uuid } }
        allDevices: { type: boolean, default: false }

    JobOptions:
      type: object
      properties:
        timeoutSeconds: { type: integer, minimum: 10, maximum: 86400, default: 3600 }
        maxRetries: { type: integer, minimum: 0, maximum: 10, default: 0 }
        retryDelaySeconds: { type: integer, minimum: 0, default: 300 }
        stopOnError: { type: boolean, default: true, description: stop the remaining steps after a failed step }
        maintenanceWindow:
          oneOf:
            - type: 'null'
            - type: object
              required: [days, start, end]
              description: Tasks are only dispatched inside the window (job time zone). end <= start crosses midnight.
              properties:
                days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 = Sunday }
                start: { type: string, example: '22:00' }
                end: { type: string, example: '05:00' }

    JobStepInput:
      type: object
      required: [scriptId]
      properties:
        scriptId: { type: string, format: uuid }
        version: { type: integer, description: default = newest approved version }
        params: { type: object, additionalProperties: true }
        continueOnError: { type: boolean, default: false }
        customFieldId: { type: [string, 'null'], format: uuid, description: store the last stdout line of this step in the custom field }

    JobInput:
      type: object
      required: [name, trigger, targets, steps]
      properties:
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: true }
        trigger: { $ref: '#/components/schemas/JobTrigger' }
        runAt: { type: [string, 'null'], format: date-time, description: required for once }
        cron: { type: [string, 'null'], description: '5-field cron, required for cron (e.g. "0 3 * * 1-5")' }
        timezone: { type: string, default: UTC, example: Europe/Berlin }
        targets: { $ref: '#/components/schemas/JobTargets' }
        options: { $ref: '#/components/schemas/JobOptions' }
        steps: { type: array, minItems: 1, items: { $ref: '#/components/schemas/JobStepInput' } }

    JobPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        trigger: { $ref: '#/components/schemas/JobTrigger' }
        runAt: { type: [string, 'null'], format: date-time }
        cron: { type: [string, 'null'] }
        timezone: { type: string }
        targets: { $ref: '#/components/schemas/JobTargets' }
        options: { $ref: '#/components/schemas/JobOptions' }
        steps: { type: array, minItems: 1, items: { $ref: '#/components/schemas/JobStepInput' } }

    Job:
      type: object
      required: [id, name, description, enabled, trigger, timezone, targets, options, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        trigger: { $ref: '#/components/schemas/JobTrigger' }
        runAt: { type: [string, 'null'], format: date-time }
        cron: { type: [string, 'null'] }
        timezone: { type: string }
        nextRunAt: { type: [string, 'null'], format: date-time }
        lastRunAt: { type: [string, 'null'], format: date-time }
        targets: { $ref: '#/components/schemas/JobTargets' }
        options: { $ref: '#/components/schemas/JobOptions' }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items:
                type: object
                required: [position, scriptId, scriptName, interpreter, scriptVersionId, version, versionStatus, params, continueOnError]
                properties:
                  position: { type: integer }
                  scriptId: { type: string, format: uuid }
                  scriptName: { type: string }
                  interpreter: { $ref: '#/components/schemas/Interpreter' }
                  scriptVersionId: { type: string, format: uuid }
                  version: { type: integer }
                  versionStatus: { type: string }
                  params: { type: object, additionalProperties: true }
                  continueOnError: { type: boolean }
                  customFieldId: { type: [string, 'null'], format: uuid }
            lastRun: { oneOf: [{ $ref: '#/components/schemas/JobRun' }, { type: 'null' }] }
            approvalId: { type: [string, 'null'], format: uuid, description: 'create/update only: broad scheduled job saved disabled until approved (four-eyes)' }

    JobRunBase:
      type: object
      required: [id, name, trigger, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        trigger: { type: string, enum: [manual, once, cron, agent_start, user_login, test, rerun, deployment, patch_scan] }
        triggeredBy: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [running, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        deploymentId: { type: [string, 'null'], format: uuid }
        ring: { type: [integer, 'null'] }

    JobRun:
      allOf:
        - $ref: '#/components/schemas/JobRunBase'
        - type: object
          required: [steps, counts, options]
          properties:
            options: { $ref: '#/components/schemas/JobOptions' }
            steps:
              type: array
              items:
                type: object
                required: [position, scriptName, version, interpreter]
                properties:
                  position: { type: integer }
                  scriptId: { type: string }
                  scriptName: { type: string }
                  scriptVersionId: { type: string }
                  version: { type: integer }
                  interpreter: { type: string }
                  sha256: { type: string }
                  params: { type: object, additionalProperties: true }
                  continueOnError: { type: boolean }
                  customFieldId: { type: [string, 'null'] }
                  kind: { type: string, enum: [script, package, patch_scan, patch_install] }
                  packageVersionId: { type: string, format: uuid }
                  files: { type: array, items: { $ref: '#/components/schemas/RunFile' } }
            counts:
              type: object
              required: [total]
              description: number of tasks per status
              additionalProperties: { type: integer }
              properties:
                total: { type: integer }

    JobRunPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobRun' } }
        total: { type: integer }

    TaskStatus:
      type: string
      enum: [pending, dispatched, running, succeeded, failed, timeout, cancelled, skipped]

    TaskRow:
      type: object
      required: [id, deviceId, hostname, os, status, attempt, cancelRequested, notBefore]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        hostname: { type: string }
        os: { $ref: '#/components/schemas/OS' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        attempt: { type: integer }
        exitCode: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        notBefore: { type: string, format: date-time }
        dispatchedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        cancelRequested: { type: boolean }

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskRow'
        - type: object
          required: [runId, runName, steps, stepResults, outputTruncated]
          properties:
            runId: { type: string, format: uuid }
            runName: { type: string }
            jobId: { type: [string, 'null'], format: uuid }
            outputBytes: { type: integer }
            outputTruncated: { type: boolean }
            steps:
              type: array
              items:
                type: object
                required: [position, scriptName, version, interpreter]
                properties:
                  position: { type: integer }
                  scriptName: { type: string }
                  version: { type: integer }
                  interpreter: { type: string }
            stepResults:
              type: array
              items:
                type: object
                required: [position, status, durationMs]
                properties:
                  position: { type: integer }
                  status: { type: string, enum: [succeeded, failed, skipped, timeout, cancelled] }
                  exitCode: { type: [integer, 'null'] }
                  durationMs: { type: integer }

    # ---------------------------------------------------------------- M3
    Confidence:
      type: string
      enum: [high, medium, low]
      description: 'high = mapping rule, medium = heuristic, low = distribution package (fix may be backported)'

    VulnBase:
      type: object
      required: [cveId, description, kev]
      properties:
        cveId: { type: string }
        description: { type: string }
        published: { type: [string, 'null'], format: date-time }
        lastModified: { type: [string, 'null'], format: date-time }
        cvssScore: { type: [number, 'null'] }
        cvssSeverity: { type: [string, 'null'], enum: [CRITICAL, HIGH, MEDIUM, LOW, NONE, null] }
        cvssVersion: { type: [string, 'null'] }
        cvssVector: { type: [string, 'null'] }
        kev: { type: boolean, description: listed in CISA Known Exploited Vulnerabilities }
        kevDateAdded: { type: [string, 'null'] }
        kevDueDate: { type: [string, 'null'] }
        kevRansomware: { type: [string, 'null'] }
        epss: { type: [number, 'null'], description: probability of exploitation in the next 30 days }
        epssPercentile: { type: [number, 'null'] }
        acceptedAt: { type: [string, 'null'], format: date-time }
        acceptedReason: { type: [string, 'null'] }

    VulnSummary:
      type: object
      required: [openCves, affectedDevices, openFindings, kev, bySeverity, unscored, mirror, feeds]
      properties:
        openCves: { type: integer }
        affectedDevices: { type: integer }
        openFindings: { type: integer }
        kev: { type: object, required: [cves, devices, overdue], properties: { cves: { type: integer }, devices: { type: integer }, overdue: { type: integer } } }
        bySeverity:
          type: object
          additionalProperties: { type: object, required: [cves, devices], properties: { cves: { type: integer }, devices: { type: integer } } }
        unscored: { type: integer }
        mirror: { type: object, required: [cves, kev], properties: { cves: { type: integer }, kev: { type: integer } } }
        feeds: { type: array, items: { $ref: '#/components/schemas/FeedState' } }

    FeedState:
      type: object
      required: [name, running, cursor, stats]
      properties:
        name: { type: string, enum: [nvd, kev, epss, osv, evaluation] }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        requestedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        running: { type: boolean }
        cursor: { type: object }
        stats: { type: object, additionalProperties: true }

    CpeRule:
      type: object
      required: [id, namePattern, ignore, priority, origin, enabled, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        namePattern: { type: string }
        publisherPattern: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
        vendor: { type: [string, 'null'] }
        product: { type: [string, 'null'] }
        ignore: { type: boolean }
        priority: { type: integer, description: lower = evaluated first }
        origin: { type: string, enum: [user, builtin] }
        enabled: { type: boolean }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    CpeRuleInput:
      type: object
      properties:
        namePattern: { type: string, example: 'Mozilla Firefox*' }
        publisherPattern: { type: [string, 'null'] }
        source: { type: [string, 'null'], enum: [registry, msi, appx, dpkg, rpm, app, null] }
        vendor: { type: [string, 'null'], example: mozilla }
        product: { type: [string, 'null'], example: firefox }
        ignore: { type: boolean }
        priority: { type: integer, default: 10 }
        enabled: { type: boolean }
        note: { type: string }

    AuditEntry:
      type: object
      required: [id, at, actorType, actorName, action, details]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actorType: { type: string, enum: [user, api_token, agent, system] }
        actorId: { type: [string, 'null'], format: uuid }
        actorName: { type: string }
        action: { type: string }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        details: { type: object }
        ip: { type: [string, 'null'] }

    # ---------------------------------------------------------------- M5
    Platform: { type: string, enum: [windows, linux, macos] }
    PackageType:
      type: string
      enum: [msi, exe, winget, choco, deb, rpm, apt, dnf, pkg, brew, script]
      description: |
        msi/exe (Windows, file), winget/choco (Windows, package id), deb/rpm (Linux, file + package name),
        apt/dnf (Linux, package name), pkg (macOS, file), brew (macOS, formula), script (own commands)

    Package:
      type: object
      required: [id, name, publisher, description, platform, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        publisher: { type: string }
        description: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PackageDetail:
      allOf:
        - $ref: '#/components/schemas/Package'
        - type: object
          required: [versions]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/PackageVersion' } }

    DetectionRule:
      description: All rules must match (AND). software is also evaluated server-side against the inventory.
      oneOf:
        - type: object
          required: [type, name]
          properties:
            type: { type: string, enum: [software] }
            name: { type: string, description: 'glob on the display name, * and ?' }
            version: { type: string }
            operator: { type: string, enum: [eq, gte, lt], default: gte }
        - type: object
          required: [type, path]
          properties:
            type: { type: string, enum: [file] }
            path: { type: string, description: 'environment variables allowed on Windows, e.g. %ProgramFiles%' }
            version: { type: string, description: minimum file version (Windows only) }
        - type: object
          required: [type, key]
          properties:
            type: { type: string, enum: [registry] }
            key: { type: string, example: 'HKLM\SOFTWARE\Vendor\App' }
            value: { type: string }
            data: { type: string }
        - type: object
          required: [type, command]
          properties:
            type: { type: string, enum: [command] }
            command: { type: string, description: 'PowerShell (Windows) or bash; exit code 0 = installed' }

    PackageVersionInput:
      type: object
      required: [version, type]
      properties:
        version: { type: string, maxLength: 50 }
        type: { $ref: '#/components/schemas/PackageType' }
        packageRef: { type: [string, 'null'], description: 'package id/name (winget, choco, apt, dnf, brew, deb, rpm)' }
        installArgs: { type: string, description: 'MSI/EXE arguments or extra arguments for the package manager' }
        installCommand: { type: string, description: type script only }
        uninstallCommand: { type: string, description: 'required for uninstalling exe, pkg and script packages' }
        productCode: { type: [string, 'null'], description: 'MSI product code {GUID} for uninstallation without file' }
        detection: { type: array, items: { $ref: '#/components/schemas/DetectionRule' }, maxItems: 20 }
        successCodes: { type: array, items: { type: integer }, default: [0] }
        rebootCodes: { type: array, items: { type: integer }, default: [3010, 1641] }
        timeoutSeconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
        changeNote: { type: string }

    PackageVersionPatch:
      type: object
      properties:
        version: { type: string, maxLength: 50 }
        packageRef: { type: [string, 'null'] }
        installArgs: { type: string }
        installCommand: { type: string }
        uninstallCommand: { type: string }
        productCode: { type: [string, 'null'] }
        detection: { type: array, items: { $ref: '#/components/schemas/DetectionRule' } }
        successCodes: { type: array, items: { type: integer } }
        rebootCodes: { type: array, items: { type: integer } }
        timeoutSeconds: { type: integer }
        changeNote: { type: string }

    PackageVersion:
      type: object
      required: [id, packageId, version, type, status, detection, successCodes, rebootCodes, timeoutSeconds, file, createdAt]
      properties:
        id: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        version: { type: string }
        type: { $ref: '#/components/schemas/PackageType' }
        packageRef: { type: [string, 'null'] }
        installArgs: { type: string }
        installCommand: { type: string }
        uninstallCommand: { type: string }
        productCode: { type: [string, 'null'] }
        detection: { type: array, items: { $ref: '#/components/schemas/DetectionRule' } }
        successCodes: { type: array, items: { type: integer } }
        rebootCodes: { type: array, items: { type: integer } }
        timeoutSeconds: { type: integer }
        changeNote: { type: string }
        status: { type: string, enum: [draft, approved, retired] }
        fileSha256: { type: [string, 'null'] }
        fileName: { type: [string, 'null'] }
        file:
          oneOf:
            - $ref: '#/components/schemas/RunFile'
            - type: 'null'
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedBy: { type: [string, 'null'], format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }

    RunFile:
      type: object
      required: [sha256, name, sizeBytes]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        name: { type: string }
        sizeBytes: { type: integer }

    DeploymentRing:
      type: object
      required: [name, targets]
      properties:
        name: { type: string, maxLength: 50, example: Pilot }
        targets: { $ref: '#/components/schemas/JobTargets' }
        delayHours: { type: number, minimum: 0, default: 0, description: minimum time after the ring started before the next ring may start }
        minSuccessPercent: { type: number, minimum: 0, maximum: 100, default: 90, description: below this quota the deployment pauses }

    PatchFilter:
      type: object
      properties:
        classification: { type: string, enum: [critical, security, all], default: security }
        include: { type: array, items: { type: string }, description: 'only these update ids / KB numbers / package names' }
        reboot: { type: string, enum: [never, if_required], default: never }

    DeploymentInput:
      type: object
      required: [kind, rings]
      properties:
        name: { type: string, description: 'default: package name, version and action' }
        kind: { type: string, enum: [package, os_updates] }
        packageVersionId: { type: [string, 'null'], format: uuid, description: required for kind package (approved version) }
        action: { type: string, enum: [install, uninstall], default: install }
        patchFilter: { $ref: '#/components/schemas/PatchFilter' }
        rings: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/DeploymentRing' } }
        options:
          type: object
          properties:
            maxRetries: { type: integer, minimum: 0, maximum: 10 }
            retryDelaySeconds: { type: integer }
            timeoutSeconds: { type: integer, minimum: 60, maximum: 86400 }
            maintenanceWindow:
              oneOf:
                - type: 'null'
                - type: object
                  required: [days, start, end]
                  properties:
                    days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
                    start: { type: string, example: '22:00' }
                    end: { type: string, example: '05:00' }
            timezone: { type: string }

    DeploymentBase:
      type: object
      required: [id, name, kind, action, status, currentRing, rings, options, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [package, os_updates] }
        packageVersionId: { type: [string, 'null'], format: uuid }
        action: { type: string, enum: [install, uninstall] }
        patchFilter: { oneOf: [{ $ref: '#/components/schemas/PatchFilter' }, { type: 'null' }] }
        rings: { type: array, items: { $ref: '#/components/schemas/DeploymentRing' } }
        options: { $ref: '#/components/schemas/JobOptions' }
        status: { type: string, enum: [created, pending_approval, running, paused, completed, cancelled] }
        currentRing: { type: integer, description: '-1 = not started yet' }
        ringStartedAt: { type: [string, 'null'], format: date-time }
        pausedReason: { type: [string, 'null'] }
        approvalId: { type: [string, 'null'], format: uuid }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    RingStats:
      type: object
      required: [ring, name, started, finished, total, succeeded, failed, pending, skipped, successPercent]
      properties:
        ring: { type: integer }
        name: { type: string }
        started: { type: boolean }
        finished: { type: boolean }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        skipped: { type: integer }
        successPercent: { type: number }

    Deployment:
      allOf:
        - $ref: '#/components/schemas/DeploymentBase'
        - type: object
          required: [platforms, package, rings, runs, approvalStatus]
          properties:
            platforms: { type: array, items: { $ref: '#/components/schemas/Platform' } }
            package:
              type: [object, 'null']
              required: [packageId, name, platform, version, type]
              properties:
                packageId: { type: string, format: uuid }
                name: { type: string }
                platform: { $ref: '#/components/schemas/Platform' }
                version: { type: string }
                type: { $ref: '#/components/schemas/PackageType' }
            createdByName: { type: [string, 'null'] }
            approvalStatus: { type: [string, 'null'] }
            rings:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/DeploymentRing'
                  - type: object
                    required: [groupNames, stats]
                    properties:
                      groupNames: { type: array, items: { type: string } }
                      stats: { $ref: '#/components/schemas/RingStats' }
            runs:
              type: array
              items:
                type: object
                required: [id, ring, name, status, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  ring: { type: [integer, 'null'] }
                  name: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
                  finishedAt: { type: [string, 'null'], format: date-time }

    PatchSource: { type: string, enum: [windows_update, apt, dnf, softwareupdate] }

    PatchState:
      type: object
      required: [deviceId, rebootPending]
      properties:
        deviceId: { type: string, format: uuid }
        source: { oneOf: [{ $ref: '#/components/schemas/PatchSource' }, { type: 'null' }] }
        lastScanAt: { type: [string, 'null'], format: date-time }
        lastScanStatus: { type: [string, 'null'], enum: [ok, failed, null] }
        lastError: { type: [string, 'null'] }
        rebootPending: { type: boolean }
        scanRequestedAt: { type: [string, 'null'], format: date-time }

    DevicePatch:
      type: object
      required: [source, updateId, title, classification, severity, security, rebootRequired, detectedAt]
      properties:
        source: { $ref: '#/components/schemas/PatchSource' }
        updateId: { type: string }
        title: { type: string }
        kb: { type: [string, 'null'] }
        classification: { type: string }
        severity: { type: string }
        security: { type: boolean }
        version: { type: string }
        rebootRequired: { type: boolean }
        detectedAt: { type: string, format: date-time }

    PatchDevice:
      type: object
      required: [deviceId, hostname, os, missing, security, critical, rebootPending]
      properties:
        deviceId: { type: string, format: uuid }
        hostname: { type: string }
        os: { type: string }
        osVersion: { type: string }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        source: { type: [string, 'null'] }
        lastScanAt: { type: [string, 'null'], format: date-time }
        lastScanStatus: { type: [string, 'null'] }
        lastError: { type: [string, 'null'] }
        rebootPending: { type: boolean }
        missing: { type: integer }
        security: { type: integer }
        critical: { type: integer }

    PatchSummary:
      type: object
      required: [devices, scanned, neverScanned, scanFailed, stale, upToDate, withMissing, withSecurity, withCritical, rebootPending, missingTotal, securityTotal, scanIntervalHours, topUpdates]
      properties:
        devices: { type: integer }
        scanned: { type: integer }
        neverScanned: { type: integer }
        scanFailed: { type: integer }
        stale: { type: integer, description: last scan older than twice the interval }
        upToDate: { type: integer }
        withMissing: { type: integer }
        withSecurity: { type: integer }
        withCritical: { type: integer }
        rebootPending: { type: integer }
        missingTotal: { type: integer }
        securityTotal: { type: integer }
        scanIntervalHours: { type: number }
        topUpdates:
          type: array
          items:
            type: object
            required: [updateId, source, title, security, devices]
            properties:
              updateId: { type: string }
              source: { $ref: '#/components/schemas/PatchSource' }
              title: { type: string }
              kb: { type: [string, 'null'] }
              severity: { type: string }
              security: { type: boolean }
              devices: { type: integer }

    # ---------------------------------------------------------------- M6
    TrendPoint:
      type: object
      required: [day, value]
      properties:
        day: { type: string, format: date }
        value: { type: number }

    Dashboard:
      type: object
      required: [generatedAt, trends]
      properties:
        generatedAt: { type: string, format: date-time }
        devices:
          type: object
          required: [total, online, stale7d, byOs]
          properties:
            total: { type: integer }
            online: { type: integer }
            stale7d: { type: integer, description: not seen for 7 days }
            byOs: { type: object, additionalProperties: { type: integer } }
        vulnerabilities:
          type: object
          required: [findingsOpen, devicesCritical, devicesKev]
          properties:
            findingsOpen: { type: integer }
            devicesCritical: { type: integer }
            devicesKev: { type: integer }
        patches:
          type: object
          required: [devicesSecurity, missingTotal, rebootPending]
          properties:
            devicesSecurity: { type: integer }
            missingTotal: { type: integer }
            rebootPending: { type: integer }
        tasks:
          type: object
          required: [failed24h]
          properties:
            failed24h: { type: integer }
        deployments:
          type: object
          required: [running, paused, pendingApproval]
          properties:
            running: { type: integer }
            paused: { type: integer }
            pendingApproval: { type: integer }
        approvals:
          type: object
          required: [pending]
          properties:
            pending: { type: integer }
        integrity:
          type: object
          required: [violations7d]
          properties:
            violations7d: { type: integer }
        licenses:
          type: object
          required: [total, overused, expiringSoon, expired]
          properties:
            total: { type: integer }
            overused: { type: integer }
            expiringSoon: { type: integer }
            expired: { type: integer }
        security: { $ref: '#/components/schemas/SecuritySummary' }
        assets:
          type: object
          required: [total, inStock, warrantyExpiring30d, warrantyExpired]
          properties:
            total: { type: integer, description: not retired }
            inStock: { type: integer }
            warrantyExpiring30d: { type: integer }
            warrantyExpired: { type: integer }
        trends:
          type: object
          description: daily values per metric key (fleet-wide; only for globally entitled users)
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }

    ReportColumn:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [string, number, date, boolean] }

    ReportSource:
      type: object
      required: [key, label, permission, defaultColumns, columns]
      properties:
        key: { type: string }
        label: { type: string }
        permission: { type: string }
        defaultColumns: { type: array, items: { type: string } }
        columns: { type: array, items: { $ref: '#/components/schemas/ReportColumn' } }

    ReportFilter:
      type: object
      required: [field, op]
      properties:
        field: { type: string }
        op: { type: string, enum: [eq, ne, contains, starts, gt, gte, lt, lte, in, empty, notempty] }
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
            - type: array
              items: { oneOf: [{ type: string }, { type: number }] }

    ReportSort:
      type: object
      required: [field, dir]
      properties:
        field: { type: string }
        dir: { type: string, enum: [asc, desc] }

    ReportDefinition:
      type: object
      required: [source]
      properties:
        source: { type: string }
        columns: { type: array, items: { type: string }, description: 'empty = default columns' }
        filters: { type: array, items: { $ref: '#/components/schemas/ReportFilter' } }
        sort: { oneOf: [{ $ref: '#/components/schemas/ReportSort' }, { type: 'null' }] }

    ReportResult:
      type: object
      required: [source, columns, rows, truncated]
      properties:
        report: { type: object, properties: { id: { type: string }, name: { type: string } } }
        source: { type: string }
        columns: { type: array, items: { $ref: '#/components/schemas/ReportColumn' } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        truncated: { type: boolean }

    Report:
      type: object
      required: [id, name, description, source, columns, filters, shared, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        source: { type: string }
        sourceLabel: { type: string }
        columns: { type: array, items: { type: string } }
        filters: { type: array, items: { $ref: '#/components/schemas/ReportFilter' } }
        sort: { oneOf: [{ $ref: '#/components/schemas/ReportSort' }, { type: 'null' }] }
        shared: { type: boolean }
        mine: { type: boolean }
        ownerName: { type: [string, 'null'] }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      required: [id, webhookId, event, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        webhookId: { type: string, format: uuid }
        event: { type: string }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        responseStatus: { type: [integer, 'null'] }
        lastError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }

    Webhook:
      type: object
      required: [id, name, url, events, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDelivery:
          type: [object, 'null']
          properties:
            status: { type: string }
            event: { type: string }
            responseStatus: { type: [integer, 'null'] }
            lastError: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }

    WebhookWithSecret:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret: { type: string, description: only returned on creation / rotation }

    LicenseInput:
      type: object
      required: [name, softwarePattern, seats]
      properties:
        name: { type: string }
        vendor: { type: string }
        softwarePattern: { type: string, description: 'glob on the software name (* and ?), case-insensitive' }
        publisherPattern: { type: [string, 'null'] }
        seats: { type: integer, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date }
        cost: { type: [number, 'null'] }
        notes: { type: string }

    LicensePatch:
      type: object
      properties:
        name: { type: string }
        vendor: { type: string }
        softwarePattern: { type: string }
        publisherPattern: { type: [string, 'null'] }
        seats: { type: integer, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date }
        cost: { type: [number, 'null'] }
        notes: { type: string }

    License:
      type: object
      required: [id, name, vendor, softwarePattern, seats, used, available, overused, expired, expiringSoon, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        vendor: { type: string }
        softwarePattern: { type: string }
        publisherPattern: { type: [string, 'null'] }
        seats: { type: integer }
        expiresAt: { type: [string, 'null'], format: date }
        cost: { type: [string, 'null'], description: decimal as string }
        notes: { type: string }
        used: { type: integer, description: active devices with matching software }
        available: { type: integer }
        overused: { type: boolean }
        daysToExpiry: { type: [integer, 'null'] }
        expired: { type: boolean }
        expiringSoon: { type: boolean, description: expires within 30 days }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LicenseDetail:
      allOf:
        - $ref: '#/components/schemas/License'
        - type: object
          required: [devices]
          properties:
            devices:
              type: array
              items:
                type: object
                required: [deviceId, hostname, software, version]
                properties:
                  deviceId: { type: string, format: uuid }
                  hostname: { type: string }
                  software: { type: string }
                  version: { type: string }
                  publisher: { type: string }

    # ---------------------------------------------------------------- M7
    KeyLabel:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }

    Issue:
      type: object
      required: [code, label]
      properties:
        code: { type: string, description: 'e.g. unencrypted, encryption_suspended, av_missing, av_outdated, firewall_off, secure_boot_off, tpm_missing' }
        label: { type: string }

    SecuritySummary:
      type: object
      required: [devices, reported, compliant, noncompliant, encryption, antivirus, firewall, issues]
      properties:
        devices: { type: integer, description: active devices in scope }
        reported: { type: integer, description: devices with a reported security status }
        compliant: { type: integer }
        noncompliant: { type: integer }
        encryption: { type: object, additionalProperties: { type: integer } }
        antivirus: { type: object, additionalProperties: { type: integer } }
        firewall: { type: object, additionalProperties: { type: integer } }
        issues: { type: object, additionalProperties: { type: integer }, description: devices per issue code }

    DeviceSecurityRow:
      type: object
      required: [deviceId, hostname, os, online, reported, compliant, encryption, antivirus, firewall, tpm, issues]
      properties:
        deviceId: { type: string, format: uuid }
        hostname: { type: string }
        os: { type: string }
        osVersion: { type: string }
        online: { type: boolean }
        reported: { type: boolean }
        compliant: { type: boolean }
        encryption: { type: string, enum: [encrypted, partial, unencrypted, unknown] }
        antivirus: { type: string, enum: [ok, outdated, disabled, missing, unknown] }
        firewall: { type: string, enum: [on, partial, off, unknown] }
        secureBoot: { type: [boolean, 'null'] }
        tpm: { type: string, enum: [ready, present, missing, unknown] }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        collectedAt: { type: [string, 'null'], format: date-time }

    SecurityDetails:
      type: object
      description: Raw security section as reported by the agent.
      properties:
        encryption:
          type: object
          properties:
            product: { type: [string, 'null'] }
            volumes:
              type: array
              items:
                type: object
                required: [volume]
                properties:
                  volume: { type: string }
                  system: { type: [boolean, 'null'] }
                  encrypted: { type: [boolean, 'null'] }
                  status: { type: [string, 'null'] }
                  method: { type: [string, 'null'] }
                  protection: { type: [boolean, 'null'], description: 'false = BitLocker suspended' }
        antivirus:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              enabled: { type: [boolean, 'null'] }
              realtime: { type: [boolean, 'null'] }
              upToDate: { type: [boolean, 'null'] }
              signatureVersion: { type: [string, 'null'] }
              signatureUpdatedAt: { type: [string, 'null'] }
              lastScanAt: { type: [string, 'null'] }
        firewall:
          type: object
          properties:
            product: { type: [string, 'null'] }
            enabled: { type: [boolean, 'null'] }
            profiles: { type: array, items: { type: object, required: [name], properties: { name: { type: string }, enabled: { type: [boolean, 'null'] } } } }
        secureBoot: { type: [boolean, 'null'] }
        tpm:
          type: object
          properties:
            present: { type: [boolean, 'null'] }
            ready: { type: [boolean, 'null'] }
            version: { type: [string, 'null'] }

    DeviceSecurity:
      type: object
      required: [deviceId, collectedAt, encryption, antivirus, firewall, tpm, compliant, issues, details, updatedAt]
      properties:
        deviceId: { type: string, format: uuid }
        collectedAt: { type: string, format: date-time }
        encryption: { type: string, enum: [encrypted, partial, unencrypted, unknown] }
        antivirus: { type: string, enum: [ok, outdated, disabled, missing, unknown] }
        firewall: { type: string, enum: [on, partial, off, unknown] }
        secureBoot: { type: [boolean, 'null'] }
        tpm: { type: string, enum: [ready, present, missing, unknown] }
        compliant: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        details: { $ref: '#/components/schemas/SecurityDetails' }
        updatedAt: { type: string, format: date-time }

    AssetType: { type: string, enum: [computer, notebook, server, monitor, printer, phone, tablet, network, peripheral, other] }
    AssetStatus: { type: string, enum: [in_stock, in_use, repair, retired] }

    AssetInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/AssetType' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        manufacturer: { type: string }
        model: { type: string }
        serialNumber: { type: [string, 'null'] }
        inventoryNumber: { type: [string, 'null'], description: unique (case-insensitive) }
        location: { type: string }
        assignedTo: { type: string }
        ipAddress: { type: [string, 'null'] }
        macAddress: { type: [string, 'null'], description: normalised to AA:BB:CC:DD:EE:FF }
        purchaseDate: { type: [string, 'null'], format: date }
        warrantyUntil: { type: [string, 'null'], format: date }
        cost: { type: [number, 'null'] }
        deviceId: { type: [string, 'null'], format: uuid, description: linked managed device }
        notes: { type: string }

    AssetPatch:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/AssetType' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        manufacturer: { type: string }
        model: { type: string }
        serialNumber: { type: [string, 'null'] }
        inventoryNumber: { type: [string, 'null'] }
        location: { type: string }
        assignedTo: { type: string }
        ipAddress: { type: [string, 'null'] }
        macAddress: { type: [string, 'null'] }
        purchaseDate: { type: [string, 'null'], format: date }
        warrantyUntil: { type: [string, 'null'], format: date }
        cost: { type: [number, 'null'] }
        deviceId: { type: [string, 'null'], format: uuid }
        notes: { type: string }

    Asset:
      type: object
      required: [id, name, type, status, manufacturer, model, location, assignedTo, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/AssetType' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        manufacturer: { type: string }
        model: { type: string }
        serialNumber: { type: [string, 'null'] }
        inventoryNumber: { type: [string, 'null'] }
        location: { type: string }
        assignedTo: { type: string }
        ipAddress: { type: [string, 'null'] }
        macAddress: { type: [string, 'null'] }
        purchaseDate: { type: [string, 'null'], format: date }
        warrantyUntil: { type: [string, 'null'], format: date }
        cost: { type: [number, 'null'] }
        deviceId: { type: [string, 'null'], format: uuid }
        deviceHostname: { type: [string, 'null'] }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssetImportResult:
      type: object
      required: [dryRun, rows, created, updated, skipped, errors, warnings, unknownColumns]
      properties:
        dryRun: { type: boolean }
        rows: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors: { type: array, items: { type: object, required: [line, message], properties: { line: { type: integer }, message: { type: string } } } }
        warnings: { type: array, items: { type: object, required: [line, message], properties: { line: { type: integer }, message: { type: string } } } }
        unknownColumns: { type: array, items: { type: string } }
